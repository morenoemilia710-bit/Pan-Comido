.intro2 .acts{display:grid;gap:10px}
.intro2 .fine{text-align:center}
/* Registro: el personaje habla desde arriba */
.ahead{text-align:center;padding-top:122px;margin-top:6px}
.ahead h1,.ahead p{max-width:none}
.ahead p{margin:6px auto 0}
.peek{left:0;right:0;top:0;display:flex;justify-content:center}
.peek .spr{width:108px!important}
.peek::after{content:"";position:absolute;bottom:2px;left:50%;width:90px;height:12px;margin-left:-45px;border-radius:50%;background:rgba(61,37,22,.08);z-index:-1}
/* Navegación con botón central */
nav{background:rgba(255,255,255,.96);overflow:visible}
.navfab{position:relative;z-index:2;flex:none!important;width:58px;height:58px;margin:-28px 6px 0;border:0;border-radius:50%;background:var(--yellow);box-shadow:0 10px 22px rgba(245,196,67,.55),0 0 0 6px var(--bg);display:grid;place-items:center;font:600 1.9rem var(--fd);color:var(--ink);transition:transform .35s var(--spring)}
.navfab span{display:block;line-height:1;transition:transform .45s var(--spring)}
.navfab:hover span{transform:rotate(90deg)}.navfab:active{transform:scale(.9)}

/* v6 · ajustes de capas y del héroe */
.hrow{z-index:0}
.prof{z-index:0}
.htx{max-width:56%}
.hbtn{flex-wrap:wrap}
span.plate.plate.hpl{--z:136px!important;width:136px;height:136px;margin-top:-68px;right:-18px}
.bigch{bottom:-46px;margin-left:-107px}
.say2{margin-top:-40px}
/* Reproductor integrado */
.vposter{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;width:100%;max-width:340px;margin:8px auto 4px;aspect-ratio:4/5;border:0;border-radius:30px;overflow:hidden;padding:0 16px 20px;color:#fff;text-align:center;
  background:linear-gradient(160deg,#FFD983,#F2933A);box-shadow:var(--sh2);transition:transform .3s var(--ease)}
.vposter.c1{background:linear-gradient(160deg,#FFC895,#EE7F2D)}.vposter.c2{background:linear-gradient(160deg,#F9B9A5,#D6573C)}.vposter.c3{background:linear-gradient(160deg,#F1D9B5,#B9895A)}
.vposter.hasth{background:var(--th) center/cover}
.vposter::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(40,20,8,0) 40%,rgba(40,20,8,.65));pointer-events:none}
.vposter:hover{transform:translateY(-3px)}.vposter:active{transform:scale(.98)}
.vbgp{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%)}
.vposter.hasth .vbgp{display:none}
.vplay{position:absolute;left:50%;top:50%;width:78px;height:78px;margin:-39px 0 0 -39px;z-index:2;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 10px 30px rgba(0,0,0,.25);display:grid;place-items:center;animation:pulseW 2.2s ease-in-out infinite}
.vplay i{width:0;height:0;border-left:24px solid var(--ink);border-top:15px solid transparent;border-bottom:15px solid transparent;margin-left:6px}
@keyframes pulseW{0%,100%{box-shadow:0 10px 30px rgba(0,0,0,.25),0 0 0 0 rgba(255,255,255,.55)}50%{box-shadow:0 10px 30px rgba(0,0,0,.25),0 0 0 16px rgba(255,255,255,0)}}
.vtag{position:relative;z-index:2;background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:99px;padding:4px 12px;font-weight:700;font-size:.8rem}
.vtitle{position:relative;z-index:2;color:#fff;font:600 1.15rem var(--fd);margin-top:8px}
.vsheet{z-index:45;align-items:center;background:rgba(30,15,6,.72)}
.vsheet>.vbox{max-width:420px;width:calc(100% - 24px);border-radius:30px;padding:14px 14px 12px;background:var(--bg);max-height:none;animation:vIn .5s var(--ease) both}
.vsheet>.vbox::before{display:none}
#vp .vsheet{animation:fadeIn .3s both}
#vp .vsheet.out{animation:fadeOut .3s forwards}
@keyframes vIn{from{opacity:0;transform:translateY(40px) scale(.95)}to{opacity:1;transform:none}}
.vhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.vhead>div{flex:1;min-width:0}.vhead small{display:block;color:var(--mute);font-weight:700;font-size:.75rem}.vhead b{display:block;font:600 1rem var(--fd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vframe{position:relative;width:100%;max-height:68vh;aspect-ratio:9/16;margin:0 auto;border-radius:22px;overflow:hidden;background:#1A0E07}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vload{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#1A0E07;color:#FFF8EE;font-weight:700;transition:opacity .4s}
.vload.off{opacity:0;pointer-events:none}
.vctl{display:flex;align-items:center;gap:8px;margin-top:12px}
.vc{width:42px;height:42px;flex:none;border:0;border-radius:14px;background:#fff;box-shadow:var(--sh);font-size:1rem;color:var(--ink);display:grid;place-items:center;transition:transform .2s var(--ease)}
.vc:active{transform:scale(.9)}
.vc.main{width:50px;height:50px;border-radius:50%;background:var(--brand);font-size:1.05rem;box-shadow:0 6px 16px rgba(238,127,45,.4)}
.vbar{flex:1;height:8px;border:0;padding:0;border-radius:8px;background:#EADFCF;overflow:hidden;cursor:pointer;position:relative}
.vbar b{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:8px;background:linear-gradient(90deg,var(--yellow),var(--orange));transition:width .25s linear}
.vtime{font:600 .78rem var(--fd);color:var(--mute);min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.vbox.fb .vctl{display:none}
.vnote{text-align:center;font-size:.8rem;color:var(--mute);margin:10px 0 0}

/* =========================================================
   v7 · Flujo "mañana", agenda limpia, personajes HD y reproductor
   ========================================================= */
/* El personaje habla (globo) */
.wdots{display:flex;gap:6px;justify-content:center;margin:10px 0 4px}
.wdots i{width:8px;height:8px;border-radius:8px;background:var(--line);transition:width .45s var(--ease),background .3s}
.wdots i.on{background:var(--orange)}.wdots i.cur{width:26px;background:var(--brand)}
.sayrow{display:flex;align-items:center;gap:12px;margin:14px 0 18px}
.sayrow>.mc{flex:none}
.enter .sayrow>.mc{animation:popChar .8s var(--ease) both .05s,breathe 3.6s ease-in-out infinite 1s}
.saybub{position:relative;flex:1;background:#fff;border-radius:22px;padding:14px 16px;box-shadow:var(--sh),inset 0 0 0 2px var(--line)}
.saybub::before{content:"";position:absolute;left:-8px;top:50%;margin-top:-8px;width:16px;height:16px;background:#fff;transform:rotate(45deg);box-shadow:-2px 2px 0 var(--line)}
.saybub h1{font-size:1.38rem;line-height:1.2}
.enter .saybub{animation:bubIn .55s var(--spring) both .3s}
/* Inicio */
.qcard{position:relative;background:linear-gradient(160deg,#FFF0C9,#FFD98A);border-radius:32px;padding:18px 18px 20px;box-shadow:var(--sh);text-align:center;overflow:hidden}
.qart{position:relative;height:170px}
.qart .plate{position:absolute!important}
span.plate.plate.q1{left:50%;top:18px;margin-left:-60px;animation:plateIn .8s var(--spring) both .2s}
span.plate.plate.q2{left:12px;top:64px;animation:plateIn .8s var(--spring) both .35s}
span.plate.plate.q3{right:16px;top:30px;animation:plateIn .8s var(--spring) both .5s}
.qart .pe{animation:float 6s ease-in-out infinite}
.qdate{font:600 1rem var(--fd);color:var(--ink);margin:6px 0 14px}
.lnk{display:block;margin:16px auto 0;border:0;background:none;font:600 .95rem var(--fd);color:var(--brand-d);padding:8px}
.lnk:hover{text-decoration:underline}
.tmc{position:relative;text-align:center;background:linear-gradient(160deg,#FFF0C9,#FFD98A);border-radius:32px;padding:16px 18px 20px;box-shadow:var(--sh)}
.tmc.c1{background:linear-gradient(160deg,#FFE6CC,#FFC895)}.tmc.c2{background:linear-gradient(160deg,#FFE0D6,#F9B9A5)}.tmc.c3{background:linear-gradient(160deg,#FBF0DE,#F1D9B5)}
.tmd{display:inline-block;background:rgba(255,255,255,.85);border-radius:99px;padding:5px 12px;font-weight:700;font-size:.8rem;color:var(--ink)}
span.plate.plate.tmp,span.plate.plate.ppl{margin:14px auto 10px;animation:plateIn .8s var(--spring) both .15s}
.tmc h2,.prop h2{margin:4px 0 8px;font-size:1.45rem}
.tmm{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.tmm span{background:rgba(255,255,255,.85);border-radius:99px;padding:4px 11px;font-weight:700;font-size:.82rem;color:var(--ink)}
.tmm .no{color:var(--red-d)}.tmm .si{color:var(--leaf)}
.tmb{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
/* Paso 1: tiempo */
.tgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.tgrid button{grid-column:span 2;position:relative;border:0;border-radius:24px;background:#fff;box-shadow:var(--sh);padding:16px 6px 14px;color:var(--ink);transition:transform .35s var(--spring),background .3s,box-shadow .3s}
.tgrid button:nth-child(4),.tgrid button:nth-child(5){grid-column:span 3}
.tgrid .ti{display:block;font-size:1.7rem;transition:transform .45s var(--spring)}
.tgrid b{display:block;font:600 2rem var(--fd);line-height:1.05;margin-top:2px}
.tgrid small{color:var(--mute);font-weight:700}
.tgrid i{display:block;font-style:normal;font-weight:700;font-size:.8rem;margin-top:4px;color:var(--text)}
.tgrid button:hover .ti{transform:scale(1.2) rotate(-8deg)}
.tgrid button.on{background:var(--yellow);transform:translateY(-3px);box-shadow:0 10px 24px rgba(245,196,67,.45)}
.tgrid button.on small,.tgrid button.on i{color:var(--ink)}
.tgrid button:active{transform:scale(.95)}
/* Paso 2: ingredientes */
.pzrow{display:flex;gap:8px}.pzrow input{flex:1;background:#fff;box-shadow:var(--sh)}
.pzrow .btn{width:52px;padding:0;font-size:1.4rem}
.ingp{display:flex;flex-wrap:wrap;gap:8px}
.ingp button{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:16px;padding:8px 13px 8px 9px;background:#fff;box-shadow:var(--sh);font-weight:700;font-size:.9rem;color:var(--ink);transition:transform .3s var(--spring),background .25s,box-shadow .25s}
.ingp button span{font-size:1.3rem;transition:transform .4s var(--spring)}
.ingp button.on{background:var(--t-y);box-shadow:inset 0 0 0 2px var(--yellow)}
.ingp button.on span{transform:scale(1.15) rotate(-10deg)}
.ingp button:active{transform:scale(.92)}
.wfoot{position:sticky;bottom:calc(92px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;margin-top:20px;padding:10px;background:rgba(251,246,238,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:24px;z-index:5}
.wfoot .btn{flex:1}
.basket{display:flex;align-items:center;gap:4px;flex:none;height:56px;padding:0 16px;border-radius:18px;background:#fff;box-shadow:var(--sh);font-size:1.4rem}
.basket b{font:600 1.2rem var(--fd)}
.basket.bump{animation:press .45s var(--spring)}
#fx b.fly{position:absolute;font-size:28px;line-height:1;transform:translate(-50%,-50%);animation:fly2 .65s cubic-bezier(.5,0,.3,1) forwards}
@keyframes fly2{0%{transform:translate(-50%,-50%) scale(1)}40%{transform:translate(calc(-50% + var(--tx)*.4),calc(-50% + var(--ty)*.4 - 60px)) scale(1.3)}100%{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(.4);opacity:.6}}
.mc.r-nod{animation:nod .5s var(--ease) both!important;transform-origin:50% 100%}
@keyframes nod{0%,100%{transform:none}35%{transform:translateY(-8px) rotate(-5deg)}65%{transform:translateY(0) rotate(3deg)}}
/* Paso 3: propuesta */
.prop{position:relative;text-align:center;background:linear-gradient(160deg,#FFF0C9,#FFD98A);border-radius:32px;padding:18px 18px 18px;box-shadow:var(--sh2)}
.prop.c1{background:linear-gradient(160deg,#FFE6CC,#FFC895)}.prop.c2{background:linear-gradient(160deg,#FFE0D6,#F9B9A5)}.prop.c3{background:linear-gradient(160deg,#FBF0DE,#F1D9B5)}
.pnum{position:absolute;right:16px;top:16px;background:rgba(255,255,255,.85);border-radius:99px;padding:3px 10px;font-weight:700;font-size:.75rem;color:var(--mute)}
.pings{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:12px}
.pings span{width:40px;height:40px;border-radius:13px;background:#fff;display:grid;place-items:center;font-size:1.3rem;box-shadow:var(--sh)}
.pings span.no{opacity:.45;box-shadow:inset 0 0 0 2px var(--coral)}
.pbtn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.pbtn .btn{padding:12px 8px;font-size:.92rem}
.prop .save{margin-top:10px;background:var(--ink);color:#FFF8EE;box-shadow:0 4px 0 #1D0E05}
/* Paso 4: guardado */
.savedv{text-align:center;padding-top:20px}
.savedv>.mc{margin:0 auto}
.chk{width:64px;height:64px;margin:-26px auto 8px;position:relative}
.chk svg{width:100%;height:100%}
.chk circle{fill:var(--leaf);transform-origin:center;animation:pop .5s var(--spring) both .3s}
.chk path{fill:none;stroke:#fff;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s var(--ease) forwards .65s}
.savedv h1{font-size:1.6rem;animation:fadeUp .5s var(--ease) both .5s}
.sdate{font:600 1.05rem var(--fd);color:var(--brand-d);margin:6px 0 16px;animation:fadeUp .5s var(--ease) both .6s}
.mini{display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border-radius:22px;padding:10px 14px 10px 10px;box-shadow:var(--sh);animation:fadeUp .5s var(--ease) both .7s}
.mini b{display:block;font-weight:600}.mini small{color:var(--mute);font-weight:700}
/* Agenda */
.agh{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.agh h1{font-size:1.9rem}
.ib2{width:44px;height:44px;border:0;border-radius:14px;background:#fff;box-shadow:var(--sh);font-size:1.4rem;color:var(--ink);line-height:1}
.wkn{display:flex;align-items:center;justify-content:space-between;margin-top:14px;background:#fff;border-radius:20px;padding:8px;box-shadow:var(--sh)}
.agsum{display:flex;align-items:center;gap:10px;margin:12px 2px 4px}
.agsum b{font:600 1rem var(--fd)}
.dcard2{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:#fff;border-radius:22px;padding:6px 8px 6px 6px;box-shadow:var(--sh);overflow:visible}
.dcard2 .dmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:none;padding:0;text-align:left;color:var(--ink)}
.dcard2 span.plate.plate{margin:-8px 0 -8px -12px}
.dcard2 .dt{min-width:0}.dcard2 b{display:block;font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcard2 small{color:var(--mute);font-weight:600;font-size:.76rem}
.dcard2:hover .pe{transform:rotate(8deg) scale(1.06)}
.dic{width:36px;height:36px;flex:none;border:0;border-radius:12px;background:var(--bg);font-size:.95rem;transition:transform .2s var(--ease),background .2s}
.dic:hover{background:var(--t-o)}.dic:active{transform:scale(.88)}
.drow.tdy .dcard2{box-shadow:inset 0 0 0 2px var(--ink),var(--sh)}
.drow.fl .dcard2{animation:pop .6s var(--ease)}
.drow.tdy .dlab{background:var(--ink)}
/* Reproductor */
.sndpill{display:block;margin:10px auto 0;border:0;border-radius:99px;padding:8px 16px;background:var(--yellow);font-weight:700;color:var(--ink);box-shadow:0 6px 16px rgba(245,196,67,.45);animation:pulseW 2s ease-in-out infinite;transition:opacity .3s,transform .3s}
.sndpill.off{display:none}
.verr{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;background:var(--bg)}
.verr b{font:600 1.1rem var(--fd)}.verr small{color:var(--mute);font-weight:600}
.vnote .swap{padding:0;font-size:inherit}

/* =========================================================
   VERSIÓN 2 · ilustraciones, carrusel con gestos, calendario,
   navegación con muesca y optimización de rendimiento
   ========================================================= */
/* Ilustraciones */
span.plate.plate.plate{background:none;box-shadow:none;filter:none}
.plate .dish,.dish{display:block;width:100%;height:100%;transition:transform .5s var(--spring)}
.card:hover .dish,.dcard2:hover .dish,.hero:hover .dish{transform:rotate(10deg) scale(1.04)}
.ic2{display:inline-block;width:1.5em;height:1.5em;vertical-align:middle;filter:drop-shadow(1px 2px 0 rgba(61,37,22,.12));flex:none}
.ui{display:inline-block;width:1.15em;height:1.15em;vertical-align:-3px;flex:none}
.tmm .ic2{width:18px;height:18px;vertical-align:-4px;filter:none;margin-right:2px}
.ingp button span{display:grid;place-items:center;width:30px;height:30px}.ingp .ic2{width:30px;height:30px}
.ingt .ie .ic2{width:40px;height:40px}
.pings .ic2{width:26px;height:26px}
.ck .ie .ic2{width:30px;height:30px}
.dec .ic2{width:42px;height:42px}
.cats button span .ic2{width:34px;height:34px}
.kd{display:block;flex:none}.pick .kd{width:44px;height:44px}.kopt .kd{width:120px;height:120px}
.emrow span{width:40px!important;height:40px!important;background:none!important}.emrow .dish{width:40px;height:40px}
.dayc button span .dish{width:28px;height:28px}
/* Asistente */
.ansr{display:flex;justify-content:flex-end;margin:-6px 0 14px}
.ansr span{background:var(--brand);color:var(--ink);font-weight:700;font-size:.9rem;border-radius:18px 18px 4px 18px;padding:8px 14px;box-shadow:0 4px 12px rgba(238,127,45,.25);animation:ansIn .45s var(--spring) both .15s}
@keyframes ansIn{from{opacity:0;transform:translateX(20px) scale(.9)}to{opacity:1;transform:none}}
.gt2{display:flex;align-items:center;gap:8px;margin:20px 0 10px;font:600 .95rem var(--fd);color:var(--ink)}
.gt2 .ic2{width:26px;height:26px}
.tgrid .ti{display:grid;place-items:center;height:44px}.tgrid .ti .ic2{width:42px;height:42px;filter:none}
.tgrid button.on .ti{transform:rotate(-12deg) scale(1.1)}
.qart{height:178px}
span.plate.plate.q1{margin-left:-64px}
/* Carrusel de ideas */
.deck{position:relative;height:486px;margin:4px -20px 0;touch-action:pan-y;outline:none;overflow:hidden;cursor:grab;user-select:none}
.deck:active{cursor:grabbing}
.dk{position:absolute;left:50%;top:8px;width:78%;max-width:330px;transform-origin:50% 90%;will-change:transform;
  margin-left:calc(min(39%,165px) * -1);border-radius:34px;padding:16px 16px 18px;text-align:center;background:linear-gradient(165deg,#FFF0C9,#FFD98A);box-shadow:0 18px 40px rgba(61,37,22,.16)}
.dk.c1{background:linear-gradient(165deg,#FFE6CC,#FFC895)}.dk.c2{background:linear-gradient(165deg,#FFE0D6,#F9B9A5)}.dk.c3{background:linear-gradient(165deg,#FBF0DE,#F1D9B5)}
.dkart{width:188px;height:188px;margin:0 auto 4px;filter:drop-shadow(3px 6px 0 rgba(61,37,22,.12));will-change:transform}
.dk h2{font-size:1.32rem;margin:6px 0 8px;min-height:2.3em;display:flex;align-items:center;justify-content:center}
.dk .tmm{min-height:28px}
.dking{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:12px 0 14px}
.dking span{width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.85);display:grid;place-items:center}
.dking span.no{box-shadow:inset 0 0 0 2px var(--coral);opacity:.6}
.dking .ic2{width:28px;height:28px;filter:none}
.dking.left{justify-content:flex-start;margin:8px 0 0}
.tmm.left{justify-content:flex-start}
.dk .btn.ghost{background:rgba(255,255,255,.85);box-shadow:none}
.dnav{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0 12px}
.ddots{display:flex;gap:6px;max-width:200px;overflow:hidden}
.ddots i{width:8px;height:8px;border-radius:8px;background:var(--line);flex:none;transition:width .35s var(--ease),background .3s}
.ddots i.on{width:22px;background:var(--brand)}
.save{background:var(--ink)!important;color:#FFF8EE!important;box-shadow:0 4px 0 #1D0E05!important}
/* Calendario */
.cal{margin-top:14px;background:#fff;border-radius:28px;padding:12px 10px 14px;box-shadow:var(--sh);touch-action:pan-y}
.calhd{display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.calhd .wnav,.dnav .wnav{display:grid;place-items:center;width:38px;height:38px;border:0;border-radius:13px;background:var(--bg);color:var(--ink)}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;margin-top:14px}
.cgrid.sll>*{animation:slL .45s var(--ease) both}.cgrid.slr>*{animation:slR .45s var(--ease) both}
.cgrid>*:nth-child(2){animation-delay:.02s}.cgrid>*:nth-child(3){animation-delay:.04s}.cgrid>*:nth-child(4){animation-delay:.06s}.cgrid>*:nth-child(5){animation-delay:.08s}.cgrid>*:nth-child(6){animation-delay:.1s}.cgrid>*:nth-child(7){animation-delay:.12s}
@keyframes slL{from{opacity:0;transform:translateX(30px)}}@keyframes slR{from{opacity:0;transform:translateX(-30px)}}
.cd2{display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:none;padding:4px 0;color:var(--ink);border-radius:18px;transition:background .3s}
.cd2 small{font-size:.7rem;font-weight:600;color:var(--mute)}
.cc{position:relative;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:#F1EADF;transition:transform .45s var(--spring),box-shadow .3s}
.cd2.has .cc{background:none}
.cc .dish{width:50px;height:50px;filter:drop-shadow(1px 3px 0 rgba(61,37,22,.1))}
.cd2:not(.has):not(.past) .cc::after{content:"+";font:600 1.2rem var(--fd);color:#CBB89E}
.cd2 b{font:600 .85rem var(--fd);min-width:26px;padding:2px 6px;border-radius:99px;transition:background .3s,color .3s}
.cd2.tdy b{background:var(--brand);color:#fff}
.cd2.on{background:var(--t-y)}
.cd2.on .cc{transform:translateY(-4px) scale(1.08);box-shadow:0 0 0 3px var(--yellow)}
.cd2.on.has .cc{box-shadow:none}
.cd2.past{opacity:.5}
.cd2:active .cc{transform:scale(.9)}
.cd2.fl .cc{animation:pop .6s var(--spring)}
.calft{display:flex;align-items:center;gap:10px;margin:14px 6px 0}
.cprog{flex:1;height:8px;border-radius:8px;background:var(--chip);overflow:hidden}
.cprog i{display:block;height:100%;width:var(--p);border-radius:8px;background:linear-gradient(90deg,var(--yellow),var(--orange));transition:width .6s var(--ease)}
.calft b{font:600 .95rem var(--fd)}
.needb{display:inline-flex;align-items:center;gap:6px}
.dpanel{position:relative;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center;margin-top:14px;border-radius:28px;padding:16px;background:linear-gradient(160deg,#FFF0C9,#FFE2A2);box-shadow:var(--sh);animation:panelIn .45s var(--ease) both}
.dpanel.c1{background:linear-gradient(160deg,#FFE6CC,#FFD2AA)}.dpanel.c2{background:linear-gradient(160deg,#FFE0D6,#FBC9BA)}.dpanel.c3{background:linear-gradient(160deg,#FBF0DE,#F4E2C6)}
@keyframes panelIn{from{opacity:0;transform:translateY(12px)}}
.dpart{grid-row:span 1}
.dpday{display:inline-block;background:rgba(255,255,255,.85);border-radius:99px;padding:3px 10px;font-weight:700;font-size:.75rem;color:var(--ink)}
.dpinfo h2{margin:6px 0;font-size:1.15rem}
.dpbtn{grid-column:1/-1;display:flex;gap:8px;align-items:center;margin-top:6px}
.dpbtn .ib{display:grid;place-items:center;width:42px;height:42px;color:var(--ink)}
.dpanel .btn.sm:not(.ghost){background:var(--ink);color:#FFF8EE;box-shadow:0 3px 0 #1D0E05}
.dpanel.empty{background:#fff;grid-template-columns:auto 1fr}
.dpanel.empty h2{font-size:1.15rem;margin:6px 0 0}
.dpanel.empty .dpbtn{grid-column:auto;flex-wrap:wrap}
.dpanel.empty .btn:not(.ghost){background:var(--brand);color:var(--ink);box-shadow:0 3px 0 var(--brand-d)}
/* Navegación con muesca */
nav{left:0;right:0;bottom:0;max-width:560px;margin:0 auto;border-radius:24px 24px 0 0;padding:12px 6px calc(8px + env(safe-area-inset-bottom,0px));background:#fff;box-shadow:0 -4px 22px rgba(61,37,22,.08);gap:0;overflow:visible}
nav button{padding:14px 0 2px;transition:opacity .25s ease .05s,color .3s}
nav button.on{opacity:0;transition:opacity .15s}
nav button:active .ic{transform:scale(.85)}
.notch{position:absolute;left:0;top:0;width:120px;height:46px;pointer-events:none;z-index:2;will-change:transform;transition:transform .32s cubic-bezier(.3,.7,.2,1),opacity .2s}
.tongue{position:absolute;left:0;top:-1px;width:120px;height:46px}.tongue path{fill:var(--bg)}
.nbub{position:absolute;left:50%;top:-14px;width:52px;height:52px;margin-left:-26px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;box-shadow:0 8px 16px rgba(61,37,22,.16);transition:background .35s}
.nico{display:grid;place-items:center;color:var(--ink);transition:opacity .2s,transform .4s cubic-bezier(.34,1.6,.64,1)}
.nico svg{width:25px;height:25px}
.notch.moving .nico{opacity:0;transform:scale(.4) rotate(-20deg);transition:opacity .12s,transform .12s}
nav[data-tab=menu] .nbub{background:var(--orange)}nav[data-tab=buy] .nbub{background:var(--coral)}nav[data-tab=nino] .nbub{background:var(--red)}nav[data-tab=nino] .nico{color:#FFF8EE}
nav[data-tab=cuenta] .notch{opacity:0!important}
main{padding-bottom:120px}
.wfoot{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.snack{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
/* Rendimiento: sin desenfoques en capas grandes y animaciones en pausa mientras hay video */
.kbar,nav,.sheet,.ntf,.wfoot,.vtag,.hint{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.kbar{background:rgba(251,246,238,.97)}.wfoot{background:rgba(251,246,238,.98)}.ntf{background:#fff}
.vtag{background:rgba(40,20,8,.45)}
.vsheet{background:rgba(30,15,6,.82)!important}
body.vplaying main *,body.vplaying nav *,body.vplaying .kbar *,body.vplaying main,body.vplaying nav{animation-play-state:paused!important}
body.vplaying main{pointer-events:none}
.week,.steps2,.ingrow{contain:layout paint}
.dk,.cd2,.ingp button{contain:layout}

/* Ajustes: muesca con color de sección (franja superior + gota), círculo blanco con ícono */
nav{--navc:var(--yellow)}
nav[data-tab=menu]{--navc:var(--orange)}nav[data-tab=buy]{--navc:var(--coral)}nav[data-tab=nino]{--navc:var(--red)}
nav::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;border-radius:24px 24px 0 0;background:var(--navc);transition:background .35s}
.tongue path{fill:var(--navc);transition:fill .35s}
.nbub,nav[data-tab=menu] .nbub,nav[data-tab=buy] .nbub,nav[data-tab=nino] .nbub{background:#fff;box-shadow:0 6px 14px rgba(61,37,22,.18)}
.nico,nav[data-tab=nino] .nico{color:var(--ink)}
#fx b.fly .ic2{width:34px;height:34px}

/* =========================================================
   VERSIÓN 3 · intro de la sonrisa, asistente por pantallas y mesa giratoria
   ========================================================= */
/* Intro: la sonrisa se transforma en el logo */
#splash{background:#fff}
.sx{display:flex;flex-direction:column;align-items:center;gap:22px}
.sx-logo{position:relative;width:132px;height:132px}
.sx-sq{position:absolute;inset:0;background:#EE7F2D;border-radius:50%;transform:scale(0);animation:sxSq .6s cubic-bezier(.34,1.4,.64,1) .95s forwards}
@keyframes sxSq{0%{transform:scale(0);border-radius:50%}70%{border-radius:14%}100%{transform:scale(1);border-radius:9%}}
.sx-smile,.sx-eyes{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.sx-smile path{fill:#EE7F2D;animation:sxCol .35s ease 1.05s forwards}
@keyframes sxCol{to{fill:#F4EEDC}}

/* Paso 1: cuatro tarjetas grandes */

/* Paso 2: despensa con bandeja de elegidos */
.ingp button{position:relative}
.ingp .tick{position:absolute;right:-4px;top:-4px;width:18px;height:18px;border-radius:50%;background:var(--leaf);color:#fff;font:700 .65rem var(--fb);display:grid;place-items:center;font-style:normal;animation:pop .3s var(--spring)}

/* Paso 3: mesa giratoria */
.ttwrap{position:relative;margin:0 -20px;overflow:hidden}

.ttp{position:absolute;left:0;top:0;width:236px;height:236px;border:0;background:none;padding:0;border-radius:50%;will-change:transform,opacity;transform-origin:50% 50%;-webkit-tap-highlight-color:transparent}

.sum .ic2{width:18px;height:18px;vertical-align:-4px;filter:none}

/* video: el marco siempre en 9:16 exacto, sin bandas */
.vframe{width:min(100%,max(190px,calc((100vh - 270px)*9/16)));max-height:none;aspect-ratio:9/16;margin-left:auto;margin-right:auto;background:#000}

.vsheet{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;background:#1E0F06!important}

@keyframes pbSq{0%{transform:scale(.72) rotate(0);border-radius:42%;opacity:0;animation-timing-function:cubic-bezier(.2,.8,.3,1)}12%{opacity:1}55%{transform:scale(1.1) rotate(-8deg);border-radius:16%;animation-timing-function:ease-in-out}80%{transform:scale(.96) rotate(3deg);border-radius:10%}100%{transform:scale(1) rotate(0);border-radius:9%;opacity:1}}

  29%{transform:translateY(-21px) scale(.34,.8)}
  34%,41%{transform:translateY(-18px) scale(.39,.72)}
  43%{transform:translateY(-13px) scale(.47,.58)}
  47%,54%{transform:translateY(-18px) scale(.39,.72);border-radius:50%;animation-timing-function:cubic-bezier(.3,0,.2,1)}

.va-dots{display:flex;gap:6px;margin-top:6px}.vanim .va-dots i{all:unset;display:block;width:8px;height:8px;border-radius:99px;background:#E6D3B6;transition:width .3s}.vanim .va-dots i.on{background:var(--brand);width:18px}

@media (prefers-reduced-motion:reduce){

}

/* Confeti con los colores de la marca */
function burst(x,y,n){
  if(RM)return;const fx=document.getElementById('fx');if(!fx)return;
  if(x==null){x=innerWidth/2;y=innerHeight/2.4}
  n=Math.round((n||28)*.7);const cl=['#F5C443','#F2933A','#D6573C','#E3806F','#EE7F2D','#F6EEDF'],k=['d','s','b'];
  for(let i=0;i<n;i++){
    const el=document.createElement('i'),a=Math.random()*Math.PI*2,sp=70+Math.random()*140;
    el.className=k[i%3];el.style.background=cl[i%cl.length];
    el.style.setProperty('--x0',x+'px');el.style.setProperty('--y0',y+'px');
    el.style.setProperty('--dx',(Math.cos(a)*sp).toFixed(0)+'px');el.style.setProperty('--dy',(Math.sin(a)*sp-70).toFixed(0)+'px');
    el.style.setProperty('--r',(Math.random()*540-270).toFixed(0)+'deg');el.style.setProperty('--t',(0.8+Math.random()*.5).toFixed(2)+'s');

  }
}

   Siguen las referencias: plato o sartén visto desde arriba, comida abundante que llena el plato,
   volumen con luz desde arriba a la izquierda, sombra suave, textura fina y un cubierto al lado. */
const gu=n=>`url(#${n})`;
const Eo=(x,y,rx,ry,f,o=1,rot=0)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${f}"${o<1?` opacity="${o}"`:''}${rot?` transform="rotate(${rot} ${x} ${y})"`:''}/>`;
const Ci=(x,y,r,f,o=1)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}"${o<1?` opacity="${o}"`:''}/>`;
const Pa=(d,f,x='')=>`<path d="${d}" fill="${f}"${x}/>`;
const St=(d,c,w,o=1)=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"${o<1?` opacity="${o}"`:''}/>`;
const Tg=(x,y,r=0,s=1,inner='')=>`<g transform="translate(${x} ${y})${r?` rotate(${r})`:''}${s!==1?` scale(${s})`:''}">${inner}</g>`;
const rngI=seed=>{let s=seed*9301+49297;return()=>(s=(s*16807)%2147483647)/2147483647};
/* puntos repartidos en un círculo (girasol) con un poco de azar */
const spread=(n,R,seed,cx=60,cy=60)=>{const r=rngI(seed);return Array.from({length:n},(_,i)=>{const a=i*2.39996+r()*.5,d=R*Math.sqrt((i+.5)/n)*(.85+r()*.2);return[cx+Math.cos(a)*d,cy+Math.sin(a)*d,r()]})};
const blob=(rx,ry,seed,k=.16)=>{const r=rngI(seed),n=9,pts=Array.from({length:n},(_,i)=>{const a=i/n*Math.PI*2,f=1+(r()-.5)*k*2;return[Math.cos(a)*rx*f,Math.sin(a)*ry*f]});
  let d=`M${((pts[0][0]+pts[n-1][0])/2).toFixed(1)} ${((pts[0][1]+pts[n-1][1])/2).toFixed(1)}`;
  for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n];d+=`Q${p[0].toFixed(1)} ${p[1].toFixed(1)} ${((p[0]+q[0])/2).toFixed(1)} ${((p[1]+q[1])/2).toFixed(1)}`}return d+'Z'};

/* ===== Mesa giratoria =====
   Los platos están sobre un disco cuyo eje queda arriba, fuera de la pantalla: el plato activo
   está en el punto más bajo del círculo y los vecinos suben por el arco a los lados.
   El dedo gira la mesa (ángulo = arrastre / radio); al soltar, un resorte la lleva al plato más cercano
   teniendo en cuenta la velocidad del gesto. Solo se actualizan transformaciones (rápido y fluido). */
const TT={a:0,v:0,t:0,drag:false,sx:0,sa:0,lx:0,lt:0,vel:0,moved:false,raf:0,n:0,R:330,step:.62,cx:0,cy:0,cur:-1};
function ttLayout(){
  const tt=document.getElementById('tt');if(!tt)return;const items=tt.querySelectorAll('.ttp'),W=tt.clientWidth;
  TT.cx=W/2;TT.cy=TT.py-TT.R;
  items.forEach((el,i)=>{const th=(i*TT.step)-TT.a,ab=Math.abs(th);
    if(ab>TT.step*2.6){el.style.visibility='hidden';return}el.style.visibility='visible';
    const x=TT.cx+TT.R*Math.sin(th),y=TT.cy+TT.R*Math.cos(th),sc=1-Math.min(ab/TT.step,1.8)*.3;
    el.style.transform=`translate3d(${(x-118).toFixed(1)}px,${(y-118).toFixed(1)}px,0) scale(${sc.toFixed(3)}) rotate(${(-th*57.3).toFixed(1)}deg)`;
    el.style.opacity=(1-Math.min(ab/TT.step,2)*.28).toFixed(2);el.style.zIndex=100-Math.round(ab*40);
    el.tabIndex=ab<TT.step/2?0:-1});
  const d=document.getElementById('ttdisk');if(d)d.style.transform=`translate3d(${TT.cx-TT.R-140}px,${TT.cy-TT.R-140}px,0) rotate(${(-TT.a*57.3).toFixed(1)}deg)`;
  const idx=Math.max(0,Math.min(TT.n-1,Math.round(TT.a/TT.step)));
  if(idx!==TT.cur){TT.cur=idx;S.prop=idx;const l=proposals(),r=l[idx];if(r){const inf=document.getElementById('ttinfo'),go=document.getElementById('ttgo');
    if(inf){inf.innerHTML=ttInfo(r,idx,l.length);inf.classList.remove('sw');void inf.offsetWidth;inf.classList.add('sw')}if(go)go.dataset.v=r.id}}
}
function ttAnim(){
  cancelAnimationFrame(TT.raf);let last=performance.now();
  const tick=now=>{const dt=Math.min(.032,(now-last)/1000);last=now;
    const f=(TT.t-TT.a)*170-TT.v*24;TT.v+=f*dt;TT.a+=TT.v*dt;ttLayout();
    if(Math.abs(TT.t-TT.a)<.0005&&Math.abs(TT.v)<.002){TT.a=TT.t;TT.v=0;ttLayout();return}
    TT.raf=requestAnimationFrame(tick)};
  TT.raf=requestAnimationFrame(tick);
}
function ttGo(i){TT.t=Math.max(0,Math.min(TT.n-1,i))*TT.step;if(RM){TT.a=TT.t;ttLayout()}else ttAnim()}
function ttInit(){
  const tt=document.getElementById('tt');if(!tt||tt.dataset.on)return;tt.dataset.on=1;
  TT.n=tt.querySelectorAll('.ttp').length;TT.py=150;{const d=document.getElementById('ttdisk');const RR=Math.max(300,tt.clientWidth*.82);if(d)d.style.width=d.style.height=(2*(RR+140))+'px'}TT.R=Math.max(300,tt.clientWidth*.82);TT.step=Math.min(.7,260/TT.R);TT.cur=-1;
  TT.a=TT.t=(S.prop||0)*TT.step;TT.v=0;ttLayout();
  tt.addEventListener('pointerdown',e=>{if(e.button)return;cancelAnimationFrame(TT.raf);TT.drag=true;TT.moved=false;TT.pid=e.pointerId;TT.sx=e.clientX;TT.sa=TT.a;TT.lx=e.clientX;TT.lt=performance.now();TT.vel=0});
  tt.addEventListener('pointermove',e=>{if(!TT.drag)return;const dx=e.clientX-TT.sx;if(Math.abs(dx)>6&&!TT.moved){TT.moved=true;try{tt.setPointerCapture(TT.pid)}catch(x){}tt.classList.add('drag')}if(!TT.moved)return;
    const now=performance.now(),dt=now-TT.lt;if(dt>0)TT.vel=TT.vel*.6+((e.clientX-TT.lx)/dt)*.4;TT.lx=e.clientX;TT.lt=now;
    let a=TT.sa-dx/TT.R;const max=(TT.n-1)*TT.step;if(a<0)a*=.35;else if(a>max)a=max+(a-max)*.35;TT.a=a;
    cancelAnimationFrame(TT.raf);TT.raf=requestAnimationFrame(ttLayout)});
  const up=()=>{if(!TT.drag)return;TT.drag=false;tt.classList.remove('drag');if(!TT.moved)return;
    const proj=TT.a-(TT.vel*260)/TT.R;TT.v=-(TT.vel*1000)/TT.R*.4;ttGo(Math.round(proj/TT.step))};
  tt.addEventListener('pointerup',up);tt.addEventListener('pointercancel',up);
  tt.addEventListener('click',e=>{const b=e.target.closest('.ttp');if(TT.moved||!b||+b.dataset.i!==TT.cur){e.stopPropagation();e.preventDefault();if(!TT.moved&&b)ttGo(+b.dataset.i);TT.moved=false}},true);
  tt.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){ttGo(TT.cur+1);e.preventDefault()}if(e.key==='ArrowLeft'){ttGo(TT.cur-1);e.preventDefault()}});
  addEventListener('resize',()=>{if(document.getElementById('tt')){TT.R=Math.max(300,tt.clientWidth*.82);ttLayout()}});
}
/* ===== Carrusel de ideas con gestos =====
   La tarjeta sigue al dedo, se inclina hacia donde se arrastra y la siguiente crece
   y se aclara a medida que avanza el gesto. Al soltar, se ajusta con un resorte
   según la velocidad del gesto; en los extremos ofrece resistencia elástica. */
const DK={i:0,x:0,drag:false,sx:0,st:0,moved:false,vx:0,lx:0,lt:0,n:0,w:300,raf:0};
function deckLayout(anim){
  const deck=document.getElementById('deck');if(!deck)return;
  const cards=deck.querySelectorAll('.dk'),w=DK.w,f=-DK.x/w;
  cards.forEach((c,i)=>{const o=i-DK.i+f,a=Math.abs(o);
    c.style.transition=anim?'transform .55s cubic-bezier(.22,1.25,.36,1),opacity .4s ease':'none';
    c.style.transform=`translate3d(${o*w*.86}px,${a*14}px,0) rotate(${o*5}deg) scale(${1-Math.min(a,1.5)*.1})`;
    c.style.opacity=a>1.6?0:1-Math.min(a,1)*.35;c.style.zIndex=100-Math.round(a*10);
    c.style.pointerEvents=a<.5?'auto':'none';
    const art=c.querySelector('.dkart');if(art){art.style.transition=c.style.transition;art.style.transform=`translateX(${-o*30}px) rotate(${o*-18}deg)`}
  });
}
function deckGo(i,anim=true){
  const l=document.querySelectorAll('#deck .dk');if(!l.length)return;
  const ni=Math.max(0,Math.min(l.length-1,i)),ch=ni!==DK.i;DK.i=ni;DK.x=0;S.prop=ni;deckLayout(anim);
  document.querySelectorAll('#ddots i').forEach((d,k)=>d.classList.toggle('on',k===ni));
  const ps=document.getElementById('psave');if(ps)ps.dataset.v=l[ni].dataset.id;
  if(ch){const m=document.querySelector('.mood-t');if(m){m.classList.remove('r-nod');void m.offsetWidth;m.classList.add('r-nod')}}
}
function deckInit(){
  const deck=document.getElementById('deck');if(!deck||deck.dataset.on)return;deck.dataset.on=1;
  DK.n=deck.querySelectorAll('.dk').length;DK.w=Math.min(deck.clientWidth,420)*.8;DK.i=Math.min(S.prop||0,DK.n-1);DK.x=0;deckLayout(false);
  deck.addEventListener('pointerdown',e=>{if(e.button)return;DK.drag=true;DK.moved=false;DK.sx=e.clientX;DK.lx=e.clientX;DK.lt=performance.now();DK.vx=0;deck.setPointerCapture(e.pointerId)});
  deck.addEventListener('pointermove',e=>{if(!DK.drag)return;let dx=e.clientX-DK.sx;if(Math.abs(dx)>6)DK.moved=true;
    const now=performance.now(),dt=now-DK.lt;if(dt>0)DK.vx=(e.clientX-DK.lx)/dt;DK.lx=e.clientX;DK.lt=now;
    if((DK.i===0&&dx>0)||(DK.i===DK.n-1&&dx<0))dx*=.35;DK.x=dx;cancelAnimationFrame(DK.raf);DK.raf=requestAnimationFrame(()=>deckLayout(false))});
  const up=()=>{if(!DK.drag)return;DK.drag=false;const th=DK.w*.22;let t=DK.i;if(DK.x<-th||DK.vx<-.5)t++;else if(DK.x>th||DK.vx>.5)t--;deckGo(t)};
  deck.addEventListener('pointerup',up);deck.addEventListener('pointercancel',up);
  deck.addEventListener('click',e=>{if(DK.moved){e.stopPropagation();e.preventDefault();DK.moved=false}},true);
  deck.addEventListener('keydown',e=>{if(e.key==='ArrowRight')deckGo(DK.i+1);if(e.key==='ArrowLeft')deckGo(DK.i-1)});
}

function nutri(r){
  const T={kc:0,p:0,c:0,f:0,fi:0},byN={},ben=[],sin=[],tips=[];
  r.ing.filter(i=>inc(r,i)).forEach(i=>{
    const n=NUT[i];
    if(!n||n.nd){sin.push(i);return}
    const k=n.por/100;
    T.kc+=n.kc*k;T.p+=n.p*k;T.c+=n.c*k;T.f+=n.f*k;T.fi+=n.fi*k;
    (n.v||[]).forEach(v=>(byN[v]=byN[v]||[]).push(i));
    ben.push([i,n.b]);
    if(n.t&&tips.length<2)tips.push(n.t);

  const mk=[T.p*4,T.c*4,T.f*9],mt=(mk[0]+mk[1]+mk[2])||1,pct=mk.map(x=>Math.round(x/mt*100));
  const vits=Object.keys(byN);
  const crit=[

    {t:'Fibra',ok:T.fi>=5,v:f1(T.fi)+' g',need:'5 g o más'},
    {t:'Variedad de vitaminas y minerales',ok:vits.length>=4,v:vits.length+' distintos',need:'4 o más'}];
  const sc=crit.filter(c=>c.ok).length;
  if(T.p<8)tips.push('Si quieres que el desayuno dure más, suma una fuente de proteína: huevo, yogur, queso o maní.');
  if(T.fi<5)tips.push('Añade una fruta o avena para subir la fibra.');
  if(vits.length<4)tips.push('Usa una fruta de color, como mora, frutilla o naranja, para variar las vitaminas.');

}

  el.innerHTML=`<p class="mute"><b>Fuente:</b> ${fuente}</p>
  <h2>Personas registradas</h2>
  <div class="met"><div><b>${regs.length}</b><small>Se registraron (completaron la Bienvenida)</small></div><div><b>${entraron}</b><small>Entraron a la app al menos una vez</small></div><div><b>${regHoy}</b><small>Registros de hoy</small></div><div><b>${reg7}</b><small>Registros de los últimos 7 días</small></div></div>
  <div class="tblw" style="margin-top:10px"><table class="dt"><thead><tr><th>Mamá</th><th>Niños</th><th>Se registró</th><th>Visitas</th><th>Tiempo total</th></tr></thead><tbody>
  ${regs.map(x=>`<tr><td><b>${mn(x.n-1)}</b></td><td>${hj(x.r)}</td><td>${hm(x.r.at)}</td><td>${x.v}</td><td>${dur(x.t)}</td></tr>`).join('')||'<tr><td colspan="5">Aún no hay registros.</td></tr>'}
  </tbody></table></div>
  <h2>Uso de la app</h2>
  <div class="met"><div><b>${users.length}</b><small>Usuarias</small></div><div><b>${all.length}</b><small>Visitas registradas</small></div><div><b>${dur(prom)}</b><small>Duración promedio</small></div><div><b>${dur(tot)}</b><small>Tiempo total en la app</small></div></div>
  <div class="met" style="margin-top:8px"><div><b>${vecesSem.toFixed(1).replace('.',',')}</b><small>Veces por semana que entra cada mamá (promedio)</small></div><div><b>${dur(prom)}</b><small>Cuánto se demora cada vez (promedio)</small></div></div>
  <h2>Cada mamá</h2>
  <div class="tblw"><table class="dt"><thead><tr><th>Mamá</th><th>Entró esta semana</th><th>Tiempo esta semana</th><th>Se demora cada vez</th><th>Veces por semana</th></tr></thead><tbody>
  ${porMama.map(m=>`<tr><td><b>${mn(m.n-1)}</b></td><td>${m.v7} ${m.v7===1?'vez':'veces'}</td><td>${dur(m.t7)}</td><td>${dur(m.prom)}</td><td>${m.xsem.toFixed(1).replace('.',',')}</td></tr>`).join('')||'<tr><td colspan="5">Aún no hay visitas.</td></tr>'}
  </tbody></table></div>
  <h2>Métricas de la hipótesis (todas las mamás)</h2>
  <div class="met one">
  <div><b>${pct}% · Regresan a la app (meta 70%)</b><small>Mamás que en los últimos 5 días entraron más de 3 veces y dejaron decidido el desayuno de mañana: ${cumplen} de ${users.length}.</small></div>
  <div><b>${pq('diez')} · Tiempo (meta 50%)</b><small>Respondieron que prepararon el desayuno en 10 minutos o menos (${nq('diez')} respuestas).</small></div>
  <div><b>Satisfacción</b><small>Se adaptó a lo que tenían: ${pq('ing')} (${nq('ing')} respuestas) · Fue fácil: ${pq('easy')} (${nq('easy')} respuestas) · Le encantó al niño: ${pLike} (${rats.length} calificaciones)</small></div>
  </div>
  <h2>Visitas (entrada, salida y duración)</h2>
  <div class="tblw"><table class="dt"><thead><tr><th>Mamá</th><th>Entró</th><th>Salió</th><th>Duró</th><th>Recetas</th><th>Decidió mañana</th></tr></thead><tbody>
  ${users.filter(u=>u.ab).map(u=>`<tr><td><b>${mn(users.indexOf(u))}</b></td><td>${hm(u.ab.i)}</td><td colspan="4">Sigue en la app o salió sin cerrar</td></tr>`).join('')}
  ${all.slice(0,100).map(x=>`<tr><td><b>${mn(x.u-1)}</b></td><td>${hm(x.i)}</td><td>${hm(x.f)}</td><td>${dur(x.d)}</td><td>${x.rec||0}</td><td>${x.dec?'Sí':'No'}</td></tr>`).join('')||'<tr><td colspan="6">Aún no hay visitas cerradas.</td></tr>'}
  </tbody></table></div>
  <p class="mute">Cada mamá aparece con el nombre que escribió en la Bienvenida. Una visita termina cuando la app se cierra o queda en segundo plano.</p>
  <h2>Pruebas del equipo</h2><p class="mute">Sus propias visitas, para comprobar que el registro funciona. No cuentan en las métricas.</p>
  <div class="tblw"><table class="dt"><thead><tr><th>Nombre</th><th>Niños</th><th>Visitas</th><th>Tiempo total</th><th>Última vez</th></tr></thead><tbody>
  ${eqU.map(u=>`<tr><td><b>${esc((u.reg&&u.reg.mama)||'Sin registrarse')}</b></td><td>${hj(u.reg)}</td><td>${u.s.length+(u.ab?1:0)}</td><td>${dur(u.s.reduce((a,x)=>a+x.d,0))}</td><td>${u.s.length?hm(u.s[u.s.length-1].f):(u.ab?hm(u.ab.i):'—')}</td></tr>`).join('')||'<tr><td colspan="5">Aún no hay pruebas del equipo.</td></tr>'}
  </tbody></table></div>`;
}
/* La Bienvenida (registro) solo sale la primera vez; después la app recuerda a la mamá y su plan */
if(!S.au)S.au='intro';
ev('ses');save();checkDue();render();
</script>
